[project]
name = "portfolio-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saksham Malhotra", email = "saksh.m.malhotra@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.13",
    "langchain-google-genai>=4.5.3",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "yfinance>=1.8.0",
]

[project.scripts]
portfolio-copilot = "portfolio-copilot:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs internet and the running Postgres"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
